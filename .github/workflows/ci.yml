name: CI

# Runs the exact validation gates used during the hardening pass:
#   backend + intelligence pytest, and frontend tsc / lint / build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend + Intelligence tests
    runs-on: ubuntu-latest
    env:
      DORY_ENV: dev
      DORY_SKIP_WARMUP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12 has wheels for the full ML stack; tests only need the subset.
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r backend/requirements-test.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -v
      - name: Run intelligence tests
        run: python -m pytest intelligence/tests/ -v

  frontend:
    name: Frontend typecheck / lint / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npx vite build
